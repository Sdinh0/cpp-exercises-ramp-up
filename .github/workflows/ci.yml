name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install quality tools
        run: |
          python -m pip install clang-format==18.1.8
          sudo apt-get update
          sudo apt-get install --yes cppcheck

      - name: Check formatting
        run: clang-format --dry-run --Werror include/sensor/sensor.hpp src/*.cpp tests/*.cpp

      - name: Run Cppcheck
        run: cppcheck --enable=warning,performance,portability --suppress=normalCheckLevelMaxBranches --error-exitcode=1 --std=c++17 -I include src/*.cpp

      - name: Configure with address and undefined behavior sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-cppcheck

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install clang-format
        run: python -m pip install clang-format==18.1.8

      - name: Check formatting
        shell: pwsh
        run: |
          $files = @("include/sensor/sensor.hpp") + (Get-ChildItem src,tests -Filter *.cpp -Recurse | ForEach-Object FullName)
          clang-format --dry-run --Werror $files

      - name: Run Cppcheck
        shell: msys2 {0}
        run: cppcheck --enable=warning,performance,portability --suppress=normalCheckLevelMaxBranches --error-exitcode=1 --std=c++17 -I include src/*.cpp

      - name: Configure with address and undefined behavior sanitizers
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Debug

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error
